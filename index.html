<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Floyd-Warshall Visualizer</title>

<style>
body {
    margin:0;
    font-family: Arial;
    background:#121212;
    color:white;
}

/* Layout */
.container {
    display:flex;
}

.left {
    width:420px;
    background:#1e1e1e;
    padding:15px;
    height:100vh;
    overflow:auto;
}

.right {
    flex:1;
    padding:20px;
}

/* Buttons */
button {
    padding:8px;
    margin:5px;
    background:#333;
    color:white;
    border:none;
    cursor:pointer;
}
button:hover { background:#555; }

/* Matrix */
.matrix {
    display:grid;
    gap:5px;
    margin-top:20px;
}
.cell {
    width:50px;
    height:50px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#222;
    border-radius:6px;
    transition:0.3s;
}

.compare { background:red; }
.update { background:green; }

/* Panels */
.box {
    background:#1c1c1c;
    padding:10px;
    margin-top:15px;
    border-radius:8px;
}

/* Pseudocode */
.pseudo div {
    padding:4px;
}
.active {
    background:#444;
}

/* Responsive */
@media(max-width:980px){
    .container{flex-direction:column;}
    .left{width:100%;height:auto;}
}
</style>
</head>

<body>

<div class="container">

<div class="left">

<h2>Controls</h2>

<button onclick="buildSteps()">Build</button>
<button onclick="step()">Step</button>
<button onclick="play()">Play</button>
<button onclick="pause()">Pause</button>
<button onclick="reset()">Reset</button>

<br><br>

Speed:
<input type="range" min="0.25" max="4" step="0.25" value="1"
oninput="setSpeed(this.value)">
<span id="speedText">1x</span>

<div class="box">
Step: <span id="stepCount">0/0</span><br>
Status: <span id="status">Idle</span>
</div>

<div class="box">
<h3>Presets</h3>
<button onclick="preset(1)">Example 1</button>
<button onclick="preset(2)">Example 2</button>
<button onclick="preset(3)">Example 3</button>
</div>

<div class="box">
<h3>Statistics</h3>
Comparisons: <span id="comp">0</span><br>
Updates: <span id="upd">0</span>
</div>

<div class="box">
<h3>Pseudocode</h3>
<div id="pseudo" class="pseudo"></div>
</div>

<div class="box">
<h3>Explanation</h3>
<div id="explain"></div>
</div>

<div class="box">
<h3>Algorithm Type</h3>
Dynamic Programming (DP)
</div>

<div class="box">
<h3>Complexity</h3>
Time: O(V³)<br>
Space: O(V²)
</div>

</div>

<div class="right">
<h2>Distance Matrix</h2>
<div id="matrix" class="matrix"></div>
</div>

</div>

<script>

let graph = [];
let dist = [];
let steps = [];
let stepIndex = 0;
let speed = 1;
let timer;

let comp=0, upd=0;

const pseudoLines = [
"for k = 1 to V",
" for i = 1 to V",
"  for j = 1 to V",
"   if dist[i][j] > dist[i][k] + dist[k][j]",
"    dist[i][j] = dist[i][k] + dist[k][j]"
];

function drawPseudo(active){
    let html="";
    pseudoLines.forEach((l,i)=>{
        html+=`<div class="${i===active?'active':''}">${l}</div>`;
    });
    document.getElementById("pseudo").innerHTML=html;
}

function createMatrix(n){
    let m=document.getElementById("matrix");
    m.style.gridTemplateColumns=`repeat(${n},50px)`;
    m.innerHTML="";
    for(let i=0;i<n*n;i++){
        let d=document.createElement("div");
        d.className="cell";
        m.appendChild(d);
    }
}

function renderMatrix(data,h=[],u=[]){
    let cells=document.querySelectorAll(".cell");
    let n=data.length;

    for(let i=0;i<n;i++){
        for(let j=0;j<n;j++){
            let idx=i*n+j;
            cells[idx].innerText=data[i][j]===Infinity?"∞":data[i][j];
            cells[idx].className="cell";

            if(h.includes(`${i},${j}`)) cells[idx].classList.add("compare");
            if(u.includes(`${i},${j}`)) cells[idx].classList.add("update");
        }
    }
}

function buildSteps(){
    steps=[];
    comp=0; upd=0;

    dist=JSON.parse(JSON.stringify(graph));
    let n=dist.length;

    for(let k=0;k<n;k++){
        for(let i=0;i<n;i++){
            for(let j=0;j<n;j++){

                comp++;

                let highlight=[`${i},${j}`];
                let update=[];

                if(dist[i][j] > dist[i][k] + dist[k][j]){
                    dist[i][j]=dist[i][k]+dist[k][j];
                    upd++;
                    update.push(`${i},${j}`);
                }

                steps.push({
                    mat:JSON.parse(JSON.stringify(dist)),
                    i,j,k,
                    highlight,
                    update
                });
            }
        }
    }

    document.getElementById("stepCount").innerText=`0/${steps.length}`;
    document.getElementById("status").innerText="Ready";
}

function step(){
    if(stepIndex>=steps.length) return;

    let s=steps[stepIndex];

    renderMatrix(s.mat,s.highlight,s.update);

    document.getElementById("explain").innerText=
    `Checking if ${s.i} → ${s.j} improves via ${s.k}`;

    drawPseudo(3);

    stepIndex++;

    document.getElementById("stepCount").innerText=
    `${stepIndex}/${steps.length}`;

    document.getElementById("comp").innerText=comp;
    document.getElementById("upd").innerText=upd;
}

function play(){
    document.getElementById("status").innerText="Playing";
    timer=setInterval(step,500/speed);
}
function pause(){
    clearInterval(timer);
    document.getElementById("status").innerText="Paused";
}
function reset(){
    stepIndex=0;
    renderMatrix(graph);
    document.getElementById("status").innerText="Idle";
}

function setSpeed(v){
    speed=v;
    document.getElementById("speedText").innerText=v+"x";
}

function preset(x){
    if(x===1){
        graph=[
            [0,3,Infinity,7],
            [8,0,2,Infinity],
            [5,Infinity,0,1],
            [2,Infinity,Infinity,0]
        ];
    }
    if(x===2){
        graph=[
            [0,1,4],
            [1,0,2],
            [4,2,0]
        ];
    }
    if(x===3){
        graph=[
            [0,5,Infinity],
            [Infinity,0,3],
            [2,Infinity,0]
        ];
    }

    createMatrix(graph.length);
    renderMatrix(graph);
    reset();
}

</script>

</body>
</html>
